version: "3.8"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: resii-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - ENVIRONMENT=production
      - API_HOST=0.0.0.0
      - PORT=8100
      - RESII_DATA_DIR=/app/data
      - RESII_STORAGE_DIR=/app/data/uploads
      - RESII_BACKUP_DIR=/app/data/backups
      - DATABASE_URL=sqlite:////app/data/resii.db
      - FRONTEND_URL=http://localhost:5173
      - COOKIE_SECURE=true
    volumes:
      - resii_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: node:20-alpine
    container_name: resii-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run build && npm run preview -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api

volumes:
  resii_data:
    name: resii_data
