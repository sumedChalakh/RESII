<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RESII — AI-Powered Resume Builder & Career Platform</title>
    <meta name="description" content="AI-powered ATS resume checker, interactive editor, job tailoring, and auto-apply." />
    <!-- SPA catch-all shell does not index to protect marketing site SEO -->
    <meta name="robots" content="noindex" />
    <!-- Preconnect to API origin for fast initial handshake -->
    <link rel="preconnect" href="http://localhost:8100" crossorigin />
    <link rel="preconnect" href="https://api.resii.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>

    <!-- Inline SVG Splash Screen matching RESII Architectural Aesthetic -->
    <div id="splash" role="status" aria-live="polite">
      <div class="sp-lattice"></div>
      <div class="sp-plate">
        <svg class="sp-bracket sp-tl" viewBox="0 0 16 16" fill="none"><path d="M8 8V16M8 8H16" stroke="currentColor" stroke-width="1.5"/></svg>
        <svg class="sp-bracket sp-tr" viewBox="0 0 16 16" fill="none"><path d="M8 8V16M8 8H0" stroke="currentColor" stroke-width="1.5"/></svg>
        <svg class="sp-bracket sp-bl" viewBox="0 0 16 16" fill="none"><path d="M8 8V0M8 8H16" stroke="currentColor" stroke-width="1.5"/></svg>
        <svg class="sp-bracket sp-br" viewBox="0 0 16 16" fill="none"><path d="M8 8V0M8 8H0" stroke="currentColor" stroke-width="1.5"/></svg>
        
        <svg class="sp-pen-icon" viewBox="0 0 48 48" fill="none">
          <rect x="10" y="8" width="28" height="32" rx="2" fill="#0f4c3a" fill-opacity="0.1" stroke="#0f4c3a" stroke-width="2"/>
          <path d="M16 16H32" stroke="#0f4c3a" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 22H32" stroke="#0f4c3a" stroke-width="2" stroke-linecap="round"/>
          <path d="M16 28H26" stroke="#0f4c3a" stroke-width="2" stroke-linecap="round"/>
          <circle cx="33" cy="28" r="3" fill="#6366f1"/>
        </svg>
      </div>
      <div class="sp-caption">
        <span class="sp-eyebrow">RESII / System</span>
        <p class="sp-message">Connecting session…</p>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
