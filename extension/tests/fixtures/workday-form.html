<!DOCTYPE html>
<html>
<head>
  <title>Workday Career Site</title>
</head>
<body>
  <div data-automation-id="jobPostingHeader">Platform Systems Engineer</div>
  <header>
    <img alt="Datadog Logo" src="/logo.png" />
  </header>
  <div data-automation-id="locations">New York, NY (Remote)</div>

  <div data-automation-id="workdayApplication">
    <form>
      <div>
        <label>First Name</label>
        <input type="text" data-automation-id="legalNameSection_firstName" name="legalNameSection_firstName" />
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" data-automation-id="legalNameSection_lastName" name="legalNameSection_lastName" />
      </div>
      <div>
        <label>Email Address</label>
        <input type="email" data-automation-id="email" />
      </div>
      <div>
        <label>Phone Number</label>
        <input type="tel" data-automation-id="phone-number" />
      </div>
      <div>
        <label>Resume Upload</label>
        <input type="file" data-automation-id="file-upload-input-ref" />
      </div>
      <div>
        <label>City</label>
        <input type="text" data-automation-id="addressSection_city" />
      </div>
      <div>
        <label>Veteran Status</label>
        <select data-automation-id="veteran-status-dropdown" name="veteranStatus">
          <option value="">Select...</option>
        </select>
      </div>
      <button type="button" data-automation-id="bottom-navigation-next-button">Submit Application</button>
    </form>
  </div>
</body>
</html>
