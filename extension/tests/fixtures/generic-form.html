<!DOCTYPE html>
<html>
<head>
  <title>Acme Software - Careers Application</title>
</head>
<body>
  <h1>Apply for Backend Architect</h1>
  <div class="company">Acme Corp</div>

  <form id="generic-careers-form">
    <div>
      <label for="cand-fname">First Name</label>
      <input type="text" id="cand-fname" name="fname" />
    </div>
    <div>
      <label for="cand-lname">Last Name</label>
      <input type="text" id="cand-lname" name="lname" />
    </div>
    <div>
      <label for="cand-email">Email Address</label>
      <input type="email" id="cand-email" name="user_email" />
    </div>
    <div>
      <label for="cand-phone">Phone Number</label>
      <input type="tel" id="cand-phone" name="mobile_phone" />
    </div>
    <div>
      <label for="cand-auth">Are you authorized to work in the United States?</label>
      <input type="text" id="cand-auth" name="work_authorization" />
    </div>
    <div>
      <label for="cand-sponsor">Will you require sponsorship now or in the future?</label>
      <input type="text" id="cand-sponsor" name="visa_sponsorship" />
    </div>
    <div>
      <label for="cand-exp">Years of Experience</label>
      <input type="text" id="cand-exp" name="years_of_experience" />
    </div>
    <div>
      <label for="cand-disability">Disability Status (Voluntary)</label>
      <select id="cand-disability" name="disability_status">
        <option value="">Decline to state</option>
      </select>
    </div>
    <div>
      <label for="cand-resume">Attach Resume</label>
      <input type="file" id="cand-resume" name="resume_doc" />
    </div>
    <div>
      <button type="submit" class="submit-button">Apply Now</button>
    </div>
  </form>
</body>
</html>
