<!DOCTYPE html>
<html>
<head>
  <title>Staff Platform Engineer at Netflix | LinkedIn</title>
</head>
<body>
  <div class="jobs-unified-top-card">
    <h1 class="jobs-unified-top-card__job-title">Staff Platform Engineer</h1>
    <div class="jobs-unified-top-card__company-name">Netflix</div>
    <div class="jobs-unified-top-card__bullet">Los Gatos, CA (Remote)</div>
  </div>

  <div class="jobs-easy-apply-modal" data-view-name="job-details-and-apply">
    <form class="jobs-easy-apply-form">
      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-firstName">First name</label>
        <input type="text" id="single-line-text-form-component-formElement-firstName" name="firstName" required />
      </div>

      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-lastName">Last name</label>
        <input type="text" id="single-line-text-form-component-formElement-lastName" name="lastName" required />
      </div>

      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-email">Email address</label>
        <input type="email" id="single-line-text-form-component-formElement-email" name="email" required />
      </div>

      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-phoneNumber">Mobile phone number</label>
        <input type="tel" id="single-line-text-form-component-formElement-phoneNumber" name="phoneNumber" />
      </div>

      <div class="fb-form-element">
        <label for="file-form-component-formElement-resume">Upload resume</label>
        <input type="file" id="file-form-component-formElement-resume" name="resumeFile" />
      </div>

      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-city">City, State</label>
        <input type="text" id="single-line-text-form-component-formElement-city" name="city" />
      </div>

      <div class="fb-form-element">
        <label for="single-line-text-form-component-formElement-exp">How many years of work experience do you have with Distributed Systems?</label>
        <input type="text" id="single-line-text-form-component-formElement-exp" name="experienceYears" />
      </div>

      <div class="fb-form-element">
        <label for="demographic-gender">Gender</label>
        <select id="demographic-gender" name="gender">
          <option value="">Decline to self-identify</option>
        </select>
      </div>

      <div class="modal-footer">
        <button type="button" class="artdeco-button artdeco-button--primary" id="btn-submit-app">Submit application</button>
      </div>
    </form>
  </div>
</body>
</html>
