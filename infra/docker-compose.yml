version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    container_name: resii-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
      - marketing

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: resii-api
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - ENVIRONMENT=development
      - PORT=8100
      - API_URL=http://api.resii.local:8100
      - FRONTEND_URL=http://app.resii.local:5173
      - MARKETING_URL=http://resii.local:3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/resii_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=resii_super_secret_development_session_key_2026
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: resii-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api.resii.local:8100

  marketing:
    build:
      context: ../marketing
      dockerfile: Dockerfile
    container_name: resii-marketing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_APP_URL=http://app.resii.local:5173

  postgres:
    image: postgres:16-alpine
    container_name: resii-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resii_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: resii-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
